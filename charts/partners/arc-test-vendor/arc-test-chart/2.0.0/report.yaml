apiversion: v1
kind: verify-report
metadata:
    tool:
        verifier-version: 1.13.7
        profile:
            VendorType: partner
            version: v1.3
        reportDigest: "sha256:abc123..."
        chart-uri: N/A
        digests:
            chart: sha256:abc123def456
            package: sha256:abc123def456
        lastCertifiedTimestamp: "2026-09-16T20:00:00Z"
        testedOpenShiftVersion: "4.18"
        supportedOpenShiftVersions: ">=4.14"
        webCatalogOnly: false
        providerControlledDelivery: false
    chart:
        name: arc-test-chart
        home: https://github.com/hardengl/openshift-helm-charts-dev
        version: 2.0.0
        kubeversion: ">=1.25.0"
results:
    - check: v1.0/not-contains-crds
      type: Mandatory
      outcome: PASS
      reason: Chart does not contain CRDs
    - check: v1.0/helm-lint
      type: Mandatory
      outcome: PASS
      reason: Helm lint successful
    - check: v1.0/not-contain-csi-objects
      type: Mandatory
      outcome: PASS
      reason: CSI objects not found
    - check: v1.0/has-readme
      type: Mandatory
      outcome: PASS
      reason: Chart has a README
    - check: v1.0/contains-values
      type: Mandatory
      outcome: PASS
      reason: Values file present
    - check: v1.0/contains-values-schema
      type: Mandatory
      outcome: PASS
      reason: Values schema file present
    - check: v1.0/is-helm-v3
      type: Mandatory
      outcome: PASS
      reason: API version is v2 (Helm 3)
    - check: v1.0/images-are-certified
      type: Mandatory
      outcome: PASS
      reason: All images are certified
    - check: v1.0/has-kubeversion
      type: Mandatory
      outcome: PASS
      reason: Chart has kubeVersion
    - check: v1.0/contains-test
      type: Mandatory
      outcome: PASS
      reason: Chart contains test directory
    - check: v1.1/has-notes
      type: Optional
      outcome: PASS
      reason: Chart has NOTES.txt
    - check: v1.0/chart-testing
      type: Mandatory
      outcome: PASS
      reason: Chart install and test successful
    - check: v1.0/required-annotations-present
      type: Mandatory
      outcome: PASS
      reason: All required annotations present
